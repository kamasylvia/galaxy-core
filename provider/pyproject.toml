[project]
name = "openbb-provider-amazingdata"
version = "0.1.0"
description = "DB-backed A-share provider for OpenBB Platform (AmazingData ingested, served from local TimescaleDB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openbb-core>=1.6.8",
    "asyncpg>=0.29.0",
    "python-dateutil>=2.8",
]

[project.entry-points."openbb_provider_extension"]
amazingdata = "openbb_provider_amazingdata:provider"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
