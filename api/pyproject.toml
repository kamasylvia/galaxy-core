[project]
name = "openbb-app"
version = "1.5.12"
description = "FinAnalyzer backend (OpenBB App, pure AmazingData)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mysharelib>=1.0.5",
    "openbb>=4.7.1",
    "openbb-ai>=1.8.7",
    "asyncpg>=0.30",
    "pandas>=2.0.0",
    "pydantic-settings>=2.14.1",
    "sse-starlette>=3.4.4",
    "uvicorn>=0.40.0",
    "plotly>=6.3.0",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
openbb-app = "openbb_app.main:start"

[tool.uv.build-backend]
module-name = "openbb_app"
module-root = "src"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=6.30.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.13",
]

[tool.pyright]
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py313"
line-length = 100
