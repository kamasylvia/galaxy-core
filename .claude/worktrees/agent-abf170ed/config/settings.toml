# Galaxy Data Ingest 配置文件
# 注意：敏感信息（密码、密钥等）应通过环境变量传入

[amazing_data]
# AmazingData API 配置（非敏感）
# username, password, host, port 通过环境变量 GALAXY_USERNAME, GALAXY_PASSWORD, GALAXY_HOST, GALAXY_PORT 传入
local_path = "./cache/"

# 连接和超时设置（非敏感）
timeout = 30

[database]
# TimescaleDB 连接配置（非敏感）
# host, port, database, user, password 通过环境变量 DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD 传入

# 连接池设置（非敏感）
pool_size = 10
max_overflow = 20
pool_timeout = 30

[sync]
# 数据同步配置
default_start_year = 2013
batch_size = 1000
adjust_for_split = true

[logging]
level = "INFO"
file_path = "./logs/"
max_size = "100MB"
backup_count = 5
# 新增配置：按日期时间分目录存储日志
enable_separate_log_files = true
log_file_pattern = "./logs/{date}/{time}.log"
