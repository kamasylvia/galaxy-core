# Galaxy DB Bridge 生产环境配置
# 敏感信息（密码、密钥等）通过环境变量传入，见下方注释

[amazing_data]
# API 本地缓存目录
local_path = "./data/local_cache/"
# SDK 调用超时（秒）：阻塞型 SDK 调用的 asyncio.wait_for 上限。
# 实测 month 周期 500 只 × 13 年正常响应需 ~5-7min,300s 会误杀边缘 chunk。
# 取 600s(10min)覆盖最慢正常响应,拦截 SDK 端真挂起(month 曾观察正常 5min)。
api_timeout_seconds = 600

# 数据库连接信息通过环境变量传入：
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# 代码中直接读取环境变量，不从此配置读取

[kline]
# K-line 默认起始日期（YYYYMMDD）
default_start_date = "20130101"

[sync.batch]
# asyncpg 每批写入记录数（受参数数量限制）
db_upsert = 100
# API 侧分批的内存预算:每批最大行数。chunk_size = 预算 / 每 symbol 行数(窗口自适应)。
# 全量首启 day(13年 ~3159行/只)→ chunk ≈ 500 只/批(分批防 OOM);
# 增量 day(1天 1行/只)→ chunk ≈ 158 万只/批(等于不分批,不浪费 API 调用);
# week/month 数据稀疏 → chunk 自动放大(每批行数仍 ≤ 预算)。
# 158 万 ≈ 全量 day 500 只的安全水位(~2.5GB)。调此值线性控制所有日度类数据内存。
# 适用:K线/fundflow 3表/industry_daily。financial/stock_basic 等稀疏类不分批。
api_batch_rows = 1580000
# 成分股二维展开类(industry_weight)的独立分批基准(每指数数,非 symbols)。
# industry_weight 每指数×每日×多成分股,倍率/行数模型不适用,实测 20 指数/批安全。
weight_chunk_size = 20
# 资金流向 per-symbol 三表(long_hu_bang/block_trading/margin_detail)的固定上限。
# fundflow 是事件驱动(非纯日度),且 SDK 对 >200 只严重变慢,实测 100 安全。
fundflow_chunk_size = 100
# 日度行情类(industry_daily)的 codes 数硬上限。
# SDK 对大批量 codes 卡死/返空(实测 7 天窗口算出 chunk=22 万 → 511 codes 一次传卡死)。
# 大窗口(全量 day 13 年)内存预算主导 chunk=500;小窗口(增量 7 天)被此 cap 拦到 100。
daily_code_cap = 100
# K 线 codes 上限(2026-08-06):SDK get_kline 对 3000+ 只 code_list 的 day 增量
# 不稳定(混合市场静默丢沪深 / 单市场大组卡死)。市场分组 + 500/批分批规避。
kline_code_cap = 500

[logging]
level = "INFO"
file_path = "./logs/"
max_size = "50MB"
backup_count = 5
enable_separate_log_files = true
log_file_pattern = "./logs/{date}/{time}.log"

[scheduler]
# realtime_sub 窗口 14:00-15:10(2026-10-27 裁决:ETF-only + min1/min5,尾盘段);白天其余时段零 SDK。
# 全量改走 0:10 独立 job(minute_cover_*),残留追扫往回 minute_rescan_days 天。

# 交易日历同步：每年 12 月 20 日 ~ 31 日检查并同步下一年日历
calendar_sync_day = 20
calendar_check_window_start = 20
calendar_check_window_end = 31
# 当前年日历完整性校验（2026-07-14）：非 12 月每天 00:00 校验当前年日历，
# 已有交易日数低于 (month-1)×此值 则补全年。A 股月均 ~20 交易日，18 留容差。
calendar_min_trading_days_per_month = 18

# 重试策略：固定间隔 + 最大次数
max_retries = 3
retry_delay_minutes = 60

# 自动同步范围
# 分钟定稿覆盖启用(2026-10-27:此前缺分钟周期,run_minute 自 10/22 起一直空转,
# 实时行 is_final 永不翻正;探针实证 SDK 分钟查询支持 ETF(min1 242/min5 48 根)。
enabled_intervals = ["day", "week", "month", "season", "year", "min1", "min5"]
# 分钟周期的 security_types 独立收窄(2026-10-27 裁决:分钟只定稿 ETF;
# 日/周/月等长周期仍用 security_types 全集——若分钟沿用全集,
# 股票/指数全量分钟查询会击穿 100G/年配额)。
minute_security_types = ["EXTRA_ETF"]
# 分钟回补窗(天):新 symbol 首启从 sync_date-N 起,防 default_start_date(20130101)
# 触发全史分钟拉取(1636 ETF ≈ 12 亿行)。
minute_backfill_days = 8
security_types = ["EXTRA_ETF", "EXTRA_STOCK_A", "EXTRA_INDEX_A"]

# 分钟线 T+1 定稿覆盖(2026-10-22 引入):盘中由 realtime_sub 实时写(is_final=false),
# 次日 0:10 用 query_kline 同窗覆盖(is_final=true)。退出 12:00 主链(白天 TGW 留给实时订阅)。
minute_cover_hour = 0
minute_cover_minute = 10
# 分钟线保留天数(2026-10-22 引入):Timescale retention policy,滚动删除超期 chunk。
# 按 8 周期全量约 1GB/天:22 天 ≈ 22GB(一个月交易日,技术指标刚好够算)。
minute_retention_days = 22

# 实时订阅(2026-10-22 引入):AM 限并发,订阅只在交易时段跑。
# scheduler 主进程按 start/end spawn/kill 子进程,不用 systemd timer。
# 时间语义:北京时间 HH:MM(与 scheduler 其他触发器一致,经 _now_cst 解释)。
# 订阅 universe:股票代码前缀 LIKE 列表(公开发布用户可配;默认沪深 ETF 全集)
realtime_sub_universe_prefixes = ["51%", "56%", "58%", "15%"]
# 订阅周期(SDK Period 名:min1/min3/min5/min10/min15/min30/min60/min120)
realtime_sub_periods = ["min1", "min5"]
realtime_sub_start = "14:00"
realtime_sub_end = "15:10"
# 攒批落库间隔(秒):OnKline 回调攒 N 秒批量 upsert,防 PG 被打爆。
realtime_sub_flush_seconds = 10
# 残留追扫往回天数(T+2 才发布场景):追扫 is_final=false,有残留即重跑覆盖。
minute_rescan_days = 8

# 完整性检查配置
check_intervals = ["day", "week", "month", "season", "year"]
monthly_full_check_hour = 0
monthly_full_check_minute = 0
routine_lookback_periods = 10

# 数据起始年份（AmazingData 统一为 2013）
data_start_year = 2013

# 自动清理保留天数（sync_state 表 + 文件日志目录）
cleanup_retention_days = 30

# kline 独立重试(2026-08-25 改):主同步 12:00,失败后每小时重试,最多 3 次
# (12:00 → 13:00 → 14:00 → 15:00,共 4 次尝试)。此前凌晨时代的 max_retries=6
# 跨 0-6h 窗口已不适用。其他 job(fundflow/financial/refdata)用全局
# max_retries=3 + retry_delay=60min,与 kline 一致,此子表仅作显式声明。
[scheduler.kline]
max_retries = 3

[index]
# 交易所指数日线行情：复用 kline 管线（security_types 已含 EXTRA_INDEX_A）
# 此处仅配置交易所指数维度数据 + 行业指数数据相关参数

# 暂停 index_weight 自动同步：AmazingData API 自 2026-05-14 起停供，SDK 对空响应
# 有 bug（sort_values('TRADE_DATE') KeyError），导致每日 ERROR。SDK 修复后改为 false
# 即恢复自动同步（从 last_sync_date=2026-05-13 续拉）。
disable_index_weight = true

# get_index_weight SDK 硬限制：仅支持 5 个指数
index_weight_codes = ["000016.SH", "000300.SH", "000905.SH", "000906.SH", "000852.SH"]

# 交易所指数代码列表来源（get_code_list 的 security_type）
index_security_type = "EXTRA_INDEX_A"

[fundflow]
# per-symbol 资金流向表(long_hu_bang/block_trading/margin_detail)的证券范围
# EXTRA_STOCK_A_SH_SZ = 上交所A股和深交所A股(AmazingData 文档 3.5.2.1)
# margin_summary 全市场汇总无需 universe;akshare_sector_fund_flow 当日快照无需 universe
security_type = "EXTRA_STOCK_A_SH_SZ"
