[project]
name = "galaxy-core"
version = "0.1.0"
description = "AmazingData to Database Bridge"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "amazingdata @ file:///${PROJECT_ROOT}/wheels/AmazingData-1.1.15-cp314-none-any.whl",
    "tgw @ file:///${PROJECT_ROOT}/wheels/tgw-1.0.9.2-py3-none-any.whl",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.25.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tables>=3.9.0",
    "psycopg2-binary>=2.9.5",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "connectrpc>=0.9.0,<0.10.0",
    "dependency-injector>=4.49.0",
    "toml>=0.10.2",
    "tqdm>=4.60.0",
    "akshare>=1.18.0",
    "nocodb>=2.0.1",
]

[project.optional-dependencies]
openbb = [
    "openbb-provider-amazingdata @ file:///${PROJECT_ROOT}/packages/openbb-provider-amazingdata",
]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
galaxy = "galaxy_core.__main__:main"
galaxy-core = "galaxy_core.application.cli.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/kamasylvia/galaxy-core"
Repository = "https://github.com/kamasylvia/galaxy-core"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-benchmark>=4.0.0",
  "ruff>=0.8.0",
  "mypy>=1.0.0",
  "black>=26.1.0",
  "protoc-gen-connectrpc>=0.9.0,<0.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/galaxy_core"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
# Ruff 配置（与 uv 生态兼容）
target-version = "py314"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["galaxy_core"]
omit = ["*/tests/*", "*/gen/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
